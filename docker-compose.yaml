version: "3.8"

networks:
  shop:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  logs_data:
    driver: local

services:
  shop_backend:
    image: deepdeepak2222/shopbe:latest
    container_name: shop_backend
    restart: always
    depends_on:
      - shop_psql_db
    environment:
      - uid=1000
      - gid=1000
    env_file:
      - .env
    volumes:
      - logs_data:/var/log/shop
    networks:
      - shop
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  shop_psql_db:
    image: postgres:15-alpine
    container_name: shop_psql_db
    restart: always
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:latest
    container_name: shop_nginx
    restart: always
    depends_on:
      - shop_backend
      - shop_fe
    networks:
      - shop
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  shop_fe:
    image: deepdeepak2222/shopfe:latest
    container_name: shop_fe
    restart: always
    networks:
      - shop
    command: ["npm", "run", "preview", "--", "--host", "--port", "80"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

